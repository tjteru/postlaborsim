services:
  - type: web
    name: postlaborsim-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_REAL_FIRESTORE
        value: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1